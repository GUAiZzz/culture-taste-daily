  <g fill="#101552"><rect x="100" y="180" width="170" height="350"/><rect x="320" y="180" width="170" height="350"/><rect x="540" y="180" width="170" height="350"/><rect x="760" y="180" width="170" height="350"/><rect x="980" y="180" width="120" height="350"/></g>
