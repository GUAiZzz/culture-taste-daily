<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Fondation Cartier closing ledger</title><desc id="d">A blue exhibition room marked forty years, nearly six hundred works and more than one hundred artists, crossed by a red final-day rule.</desc><rect width="1200" height="720" fill="#2145d8"/><path d="M74 76h1052v568H74z" fill="none" stroke="#f3ead8" stroke-width="3"/><text x="88" y="150" fill="#f3ead8" font-family="Arial Black,Arial" font-size="92">40 YEARS</text><text x="88" y="264" fill="#f3ead8" font-family="Arial Black,Arial" font-size="92">≈600 WORKS</text><text x="88" y="378" fill="#f3ead8" font-family="Arial Black,Arial" font-size="92">100+ ARTISTS</text><path d="M0 488h1200" stroke="#f0442d" stroke-width="72"/><text x="600" y="507" text-anchor="middle" fill="#fffdf6" font-family="monospace" font-weight="700" font-size="28" letter-spacing="8">FINAL DAY / 23 AUG</text><text x="88" y="612" fill="#f3ead8" font-family="monospace" font-size="24">THE ARCHIVE CHANGES WHEN THE ORDER CHANGES.</text></svg>
