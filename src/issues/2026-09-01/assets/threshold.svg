<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Threshold study</title>
  <desc id="desc">Original diagram of four entry thresholds, drawn for the Culture &amp; Taste Preview.</desc>
  <rect width="1200" height="800" fill="#191716"/>
  <path d="M80 140H1120M80 400H1120M80 660H1120" stroke="#f1dfc5" stroke-width="3" opacity=".45"/>
  <path d="M150 80V720M420 80V720M690 80V720M960 80V720" stroke="#f1dfc5" stroke-width="2" opacity=".24"/>
