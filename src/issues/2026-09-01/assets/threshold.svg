  <circle cx="160" cy="140" r="18" fill="#76e6cc"/><circle cx="410" cy="400" r="18" fill="#76e6cc"/><circle cx="680" cy="140" r="18" fill="#76e6cc"/><circle cx="950" cy="400" r="18" fill="#76e6cc"/>
