<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Calendar entry card</title>
  <desc id="desc">Original diagram of a culture calendar with blue time marks, magenta selections and mint open slots, drawn for the Culture &amp; Taste Preview.</desc>
  <rect width="1200" height="800" fill="#fff4c7"/>
  <path d="M86 182H1112M86 398H1112M86 612H1112" stroke="#111827" stroke-width="3" opacity=".25"/>
  <path d="M132 102V690M324 102V690M524 102V690M724 102V690M924 102V690" stroke="#0047ff" stroke-width="8"/>
  <path d="M132 164H1060" stroke="#111827" stroke-width="18"/>
  <rect x="208" y="236" width="198" height="112" fill="#d12b6a" transform="rotate(-3 208 236)"/>
  <rect x="594" y="438" width="262" height="116" fill="#111827" transform="rotate(4 594 438)"/>
  <rect x="874" y="206" width="164" height="104" fill="#bce8d3" transform="rotate(-5 874 206)"/>
  <circle cx="132" cy="164" r="22" fill="#0047ff"/><circle cx="524" cy="164" r="22" fill="#d12b6a"/><circle cx="924" cy="164" r="22" fill="#0047ff"/>
  <path d="M920 232l48 30-48 30" fill="none" stroke="#111827" stroke-width="14"/>
  <g fill="#111827" font-family="monospace" font-weight="700" font-size="24"><text x="86" y="76">OPEN / HOLD / GO</text><text x="86" y="748">CALENDAR / 09.07</text></g>
  <g fill="#fff4c7" font-family="monospace" font-weight="700" font-size="22"><text x="234" y="304">SELECTED</text><text x="630" y="508">STAY HERE</text></g>
</svg>
