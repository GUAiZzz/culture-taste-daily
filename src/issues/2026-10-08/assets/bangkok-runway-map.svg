<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Original non-documentary Bangkok fashion week route fallback</title>
  <desc id="desc">A three-stop route diagram showing a public fashion calendar across three venues.</desc>
  <rect width="1200" height="760" fill="#fff8e4"/>
  <path d="M166 536C260 360 390 580 516 364S760 196 1040 270" fill="none" stroke="#0e4f5c" stroke-width="24"/>
  <path d="M166 536C260 360 390 580 516 364S760 196 1040 270" fill="none" stroke="#d9a441" stroke-width="5" stroke-dasharray="12 18"/>
  <g fill="#f4e6b8" stroke="#171717" stroke-width="8">
    <circle cx="166" cy="536" r="78"/><circle cx="516" cy="364" r="78"/><circle cx="1040" cy="270" r="78"/>
  </g>
  <g fill="#171717" font-family="monospace" font-size="32" font-weight="700" text-anchor="middle">
    <text x="166" y="528">PARAGON</text><text x="166" y="566">RUNWAY</text>
    <text x="516" y="356">CENTER</text><text x="516" y="394">YOUNG</text>
    <text x="1040" y="262">DISCOVERY</text><text x="1040" y="300">SELECT</text>
  </g>
  <text x="118" y="134" fill="#8b1e3f" font-family="Arial,sans-serif" font-size="58" font-weight="900">BIFW / 01—11 OCT</text>
  <text x="122" y="190" fill="#171717" font-family="monospace" font-size="24" letter-spacing="3">ORIGINAL FALLBACK / NOT A DOCUMENTARY IMAGE</text>
  <rect x="122" y="642" width="320" height="38" fill="#8b1e3f"/><rect x="468" y="642" width="320" height="38" fill="#0e4f5c"/><rect x="814" y="642" width="224" height="38" fill="#d9a441"/>
</svg>
