  <g fill="#EEE9DE" stroke="#101820" stroke-width="10">
    <circle cx="160" cy="522" r="28"/><circle cx="420" cy="480" r="28"/><circle cx="690" cy="260" r="28"/><circle cx="930" cy="446" r="28"/>
  </g>
  <rect x="82" y="92" width="240" height="74" fill="#C9F05A" transform="rotate(-4 82 92)"/>
