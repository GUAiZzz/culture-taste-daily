<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Venice sound route</title>
  <desc id="desc">A non-documentary cobalt route with open stops for the Venice Biennale Musica programme.</desc>
  <rect width="1200" height="800" fill="#EEE9DE"/>
  <path d="M70 610 C220 450 260 690 420 480 S690 170 820 350 S1010 520 1140 220" fill="none" stroke="#2448D8" stroke-width="22"/>
