    <path d="M130 570 C270 400 350 650 500 470 S760 330 910 470 S1040 640 1110 430"/>
    <path d="M155 255 C310 180 385 335 520 260 S770 140 1040 260"/>
    <path d="M260 140 L260 740 M600 115 L600 790 M930 130 L930 760" stroke="#2055d6" stroke-width="6"/>
