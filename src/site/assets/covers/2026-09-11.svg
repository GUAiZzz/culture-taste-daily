  <path d="M181 561h290v92" fill="none" stroke="#e45b3c" stroke-width="19"/>
  <path d="M712 706h301" fill="none" stroke="#b7cf73" stroke-width="12"/>
  <path d="M918 706l-28-19v38z" fill="#b7cf73"/>
  <path d="M414 91v90M832 520v96M1132 222v130" stroke="#e45b3c" stroke-width="9"/>
