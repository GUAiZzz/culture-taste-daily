<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">The Day Closes and Opens</title>
  <desc id="desc">A warm paper cover with an oversized split number 23, a closing red rule, and a small blue opening.</desc>
  <rect width="900" height="1200" fill="#f3ead8"/>
  <path d="M70 74H830M70 1126H830" fill="none" stroke="#171717" stroke-width="12"/>
  <text x="66" y="172" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" letter-spacing="5">CULTURE &amp; TASTE DAILY</text>
  <text x="62" y="822" fill="#2145d8" font-family="Arial Black, Arial, sans-serif" font-size="690" font-weight="900" letter-spacing="-72">23</text>
  <rect x="0" y="548" width="900" height="112" fill="#f0442d"/>
  <text x="68" y="621" fill="#fffdf6" font-family="Courier New, monospace" font-size="42" font-weight="700" letter-spacing="8">CLOSE — OPEN</text>
  <rect x="610" y="716" width="220" height="220" fill="#2145d8"/>
  <circle cx="720" cy="826" r="47" fill="#f3ead8"/>
  <path d="M720 746V906M640 826H800" stroke="#f3ead8" stroke-width="12"/>
  <text x="70" y="1026" fill="#171717" font-family="Georgia, serif" font-size="66" font-weight="700">一边收场，</text>
  <text x="70" y="1096" fill="#171717" font-family="Georgia, serif" font-size="66" font-weight="700">一边开盒。</text>
  <text x="704" y="1092" fill="#171717" font-family="Courier New, monospace" font-size="28" font-weight="700" letter-spacing="4">08/23</text>
</svg>
